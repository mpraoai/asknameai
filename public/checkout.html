<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AskNameAI - Secure Payment</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1F2937;
    }
    .logo span { color: #4F46E5; }
    .subtitle {
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .plan-name {
      font-size: 20px;
      font-weight: 700;
      color: #4F46E5;
      margin-bottom: 4px;
    }
    .amount {
      font-size: 36px;
      font-weight: 800;
      color: #1F2937;
      margin-bottom: 24px;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid #E5E7EB;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 16px;
      color: #6B7280;
      margin: 16px 0;
    }
    .error {
      color: #DC2626;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      font-size: 14px;
    }
    .btn {
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.4); }
    .secured-by {
      margin-top: 24px;
      font-size: 12px;
      color: #9CA3AF;
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <div class="container">
    <div class="logo">AskName<span>AI</span></div>
    <div class="subtitle">Chaldean Numerology - Secure Payment</div>

    <div id="loading">
      <div class="loader"></div>
      <div class="status">Preparing your payment...</div>
    </div>

    <div id="error-box" style="display:none">
      <div class="error" id="error-msg"></div>
      <button class="btn" onclick="window.close()">Close</button>
    </div>

    <div id="success-box" style="display:none">
      <div style="font-size:48px;margin-bottom:16px">&#10003;</div>
      <div class="status" style="font-size:18px;color:#16A34A;font-weight:700">Payment Successful!</div>
      <div class="status" id="success-detail"></div>
      <button class="btn" onclick="window.close()">Close</button>
    </div>

    <div class="secured-by">Secured by Razorpay &bull; 256-bit SSL Encryption</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    const keyId = params.get('key_id');
    const amount = parseInt(params.get('amount') || '0');
    const planName = params.get('plan_name') || 'AskNameAI Plan';
    const userName = params.get('user_name') || '';
    const userEmail = params.get('user_email') || '';
    const method = params.get('method') || 'all';

    if (!orderId || !keyId) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('error-msg').textContent = 'Missing payment order details. Please close this window and try again.';
    } else {
      document.querySelector('.plan-name').textContent = planName;
      document.querySelector('.amount').textContent = '₹' + (amount / 100).toFixed(0);

      const options = {
        key: keyId,
        amount: amount,
        currency: 'INR',
        name: 'AskNameAI',
        description: planName,
        order_id: orderId,
        prefill: {
          name: userName,
          email: userEmail,
        },
        method: {
          upi: method === 'upi' || method === 'all',
          card: method === 'card' || method === 'all',
          netbanking: method === 'all',
          wallet: method === 'all',
        },
        handler: function(response) {
          // Send result back to parent window
          if (window.opener) {
            window.opener.postMessage({
              type: 'razorpay-payment-result',
              success: true,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_signature: response.razorpay_signature,
            }, '*');
          }
          document.getElementById('loading').style.display = 'none';
          document.getElementById('success-box').style.display = 'block';
          document.getElementById('success-detail').textContent = 'Payment ID: ' + response.razorpay_payment_id;
        },
        modal: {
          ondismiss: function() {
            if (window.opener) {
              window.opener.postMessage({
                type: 'razorpay-payment-result',
                success: false,
                error: 'Payment cancelled by user',
              }, '*');
            }
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-msg').textContent = 'Payment was cancelled. You can close this window.';
          }
        },
        theme: { color: '#4F46E5' },
      };

      try {
        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function(resp) {
          if (window.opener) {
            window.opener.postMessage({
              type: 'razorpay-payment-result',
              success: false,
              error: resp.error?.description || 'Payment failed',
            }, '*');
          }
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error-box').style.display = 'block';
          document.getElementById('error-msg').textContent = resp.error?.description || 'Payment failed. Please try again.';
        });
        rzp.open();
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-msg').textContent = 'Failed to open payment: ' + err.message;
      }
    }
  </script>
</body>
</html>
