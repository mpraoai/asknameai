<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status - AskNameAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; color: #1F2937; }
    .message { font-size: 15px; color: #6B7280; margin-bottom: 24px; line-height: 1.5; }
    .loader {
      width: 48px; height: 48px;
      border: 4px solid #E5E7EB;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #4F46E5, #7C3AED);
      color: white;
      border: none;
      padding: 14px 36px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.4); }
    .success { color: #16A34A; }
    .error { color: #DC2626; }
    .detail { font-size: 13px; color: #9CA3AF; margin-top: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading">
      <div class="loader"></div>
      <div class="title">Processing Payment...</div>
      <div class="message">Please wait while we confirm your payment.</div>
    </div>

    <div id="success-box" style="display:none">
      <div class="icon">&#10003;</div>
      <div class="title success">Payment Successful!</div>
      <div class="message">Your payment has been verified. You can close this window and return to the app.</div>
      <div class="detail" id="payment-id-detail"></div>
      <br />
      <button class="btn" onclick="window.close()">Close Window</button>
    </div>

    <div id="error-box" style="display:none">
      <div class="icon">&#9888;</div>
      <div class="title error">Payment Issue</div>
      <div class="message" id="error-msg">There was an issue with your payment.</div>
      <div class="detail" id="error-detail"></div>
      <br />
      <button class="btn" onclick="window.close()">Close Window</button>
    </div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const paymentId = params.get('razorpay_payment_id');
      const orderId = params.get('razorpay_order_id');
      const signature = params.get('razorpay_signature');
      const linkId = params.get('payment_link_id');

      // Send result to parent window (the Bolt app) via postMessage
      function notifyParent(result) {
        if (window.opener) {
          window.opener.postMessage({
            type: 'razorpay-payment-result',
            ...result,
          }, '*');
        }
      }

      if (paymentId && orderId && signature) {
        // Payment succeeded — Razorpay redirected back with payment details
        notifyParent({
          success: true,
          razorpay_payment_id: paymentId,
          razorpay_order_id: orderId,
          razorpay_signature: signature,
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('success-box').style.display = 'block';
        document.getElementById('payment-id-detail').textContent = 'Payment ID: ' + paymentId;
      } else {
        // Payment failed or cancelled
        const errorMsg = params.get('error') || params.get('error_description') || 'Payment was not completed';
        notifyParent({
          success: false,
          error: errorMsg,
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-msg').textContent = errorMsg;
      }
    })();
  </script>
</body>
</html>
